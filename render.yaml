# Render reads this file when the repo is added as a Blueprint: one free web service for the API.
services:
  - type: web
    name: tarot-api
    runtime: python
    plan: free
    # Commands run here, but the whole repo is checked out: server.py reads the cards from ../tarot-app.
    rootDir: mcp-server
    # No seeding here: the journal lives in Supabase now, and seed.py would wipe it on every deploy.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.18
      # Whose account the demo journal belongs to: Katie's Auth0 user id. Not a secret: it's only a
      # label, and reading the journal still takes that account's token.
      - key: SEED_USER
        value: auth0|6a0baba86bc6960859797149
      # Supabase's session pooler connection string, with the password. Set in Render's dashboard,
      # never here.
      - key: DATABASE_URL
        sync: false
